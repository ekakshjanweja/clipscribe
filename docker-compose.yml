services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clipscribe
      POSTGRES_USER: clipscribe
      POSTGRES_PASSWORD: clipscribe-local
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipscribe -d clipscribe"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      CLIPSCRIBE_DOCKER: "1"
      PADDLE_VL_PYTHON: /usr/local/bin/python
      DATABASE_URL: postgresql://clipscribe:clipscribe-local@postgres:5432/clipscribe
      CLIPSCRIBE_UPLOADS_DIR: /data/uploads
    volumes:
      - paddle-cache:/root/.paddlex
      - huggingface-cache:/root/.cache/huggingface
      - clipscribe-cache:/app/.cache
      - job-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5349:5001"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "worker.py"]
    environment:
      CLIPSCRIBE_DOCKER: "1"
      PADDLE_VL_PYTHON: /usr/local/bin/python
      DATABASE_URL: postgresql://clipscribe:clipscribe-local@postgres:5432/clipscribe
      CLIPSCRIBE_UPLOADS_DIR: /data/uploads
    volumes:
      - paddle-cache:/root/.paddlex
      - huggingface-cache:/root/.cache/huggingface
      - clipscribe-cache:/app/.cache
      - job-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        OCR_API_URL: http://backend:5001
    depends_on:
      - backend
    ports:
      - "127.0.0.1:4329:3000"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["cloudflare"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  postgres-data:
  paddle-cache:
  huggingface-cache:
  clipscribe-cache:
  job-data:
